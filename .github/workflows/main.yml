name: Cypress E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Executar ESLint
        run: npm run lint

      - name: Limpar resultados anteriores
        run: npm run allure:clean

      - name: Executar testes Cypress
        id: tests
        run: npm run test:chrome

      - name: Gerar relatório Allure
        id: report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: npm run allure:generate

      - name: Disponibilizar relatório Allure
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 15

      - name: Disponibilizar screenshots de falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 15

      - name: Publicar relatório no GitHub Pages
        if: ${{ !cancelled() && steps.report.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
